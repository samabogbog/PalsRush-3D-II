  <!-- Eyes -->
  <circle cx="192" cy="246" r="24" fill="#1A130D" />
  <circle cx="184" cy="238" r="8" fill="#FFFDF9" />
  <circle cx="320" cy="246" r="24" fill="#1A130D" />
  <circle cx="312" cy="238" r="8" fill="#FFFDF9" />
  <!-- Snout -->
