      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#84CC16" />
    </linearGradient>
    <linearGradient id="bearGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#F59E0B" />
